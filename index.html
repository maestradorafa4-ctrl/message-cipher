<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>🔐 AES Secret Message Feed</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #0f172a;
      color: #e2e8f0;
    }

    .container {
      width: min(
        900px,
        calc(100% - 32px)
      );

      margin: 40px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    textarea,
    input {
      width: 100%;

      border: 1px solid #475569;

      background: #0f172a;
      color: #f8fafc;

      border-radius: 8px;

      padding: 12px;

      font: inherit;

      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    textarea:focus,
    input:focus {
      border-color: #38bdf8;
    }

    label {
      display: block;

      font-weight: 600;

      margin: 14px 0 7px;
    }

    button {
      border: 0;

      border-radius: 8px;

      padding: 11px 16px;

      margin-top: 14px;

      font: inherit;

      font-weight: 700;

      cursor: pointer;

      background: #38bdf8;

      color: #082f49;
    }

    button:hover {
      background: #7dd3fc;
    }

    button.secondary {
      background: #475569;
      color: white;
    }

    button.secondary:hover {
      background: #64748b;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      min-height: 20px;
      color: #94a3b8;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    .message {
      background: #0f172a;

      border: 1px solid #334155;

      border-radius: 10px;

      padding: 16px;

      margin-bottom: 14px;
    }

    .message-header {
      display: flex;

      justify-content: space-between;

      gap: 10px;

      color: #94a3b8;

      font-size: 13px;

      margin-bottom: 12px;

      flex-wrap: wrap;
    }

    .username {
      color: #38bdf8;
      font-weight: 700;
    }

    .ciphertext {
      font-family: monospace;

      font-size: 12px;

      line-height: 1.5;

      color: #64748b;

      overflow-wrap: anywhere;

      max-height: 100px;

      overflow: auto;

      padding: 8px;

      border-radius: 6px;

      background: #020617;
    }

    .decrypt-area {
      margin-top: 10px;
    }

    .decrypted {
      display: none;

      margin-top: 12px;

      padding: 12px;

      border-radius: 8px;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }

    .small {
      font-size: 12px;

      color: #64748b;

      margin-top: 8px;
    }

    .empty {
      text-align: center;

      color: #64748b;

      padding: 30px;
    }

    .feed-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;
    }

    .feed-header button {
      margin-top: 0;
    }

    @media (max-width: 600px) {

      .container {
        width: calc(100% - 20px);
        margin: 20px auto;
      }

      .card {
        padding: 15px;
      }

      .feed-header {
        align-items: flex-start;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    🔐 AES Secret Message Feed
  </h1>


  <div class="subtitle">
    Encrypt a message and publish it for others to try to decrypt.
  </div>


  <!-- CREATE MESSAGE -->

  <div class="card">

    <h2>
      Send a Secret Message
    </h2>


    <label for="username">
      Username
    </label>

    <input
      id="username"
      type="text"
      maxlength="100"
      autocomplete="nickname"
      placeholder="Enter your username"
    >


    <label for="message">
      Message
    </label>

    <textarea
      id="message"
      maxlength="10000"
      placeholder="Enter your secret message..."
    ></textarea>


    <label for="secretKey">
      Secret Key
    </label>

    <input
      id="secretKey"
      type="password"
      autocomplete="off"
      placeholder="Enter a secret key"
    >


    <div class="small">
      Your secret key is used for AES encryption.
    </div>


    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      🔒 Encrypt & Publish
    </button>


    <div
      id="sendStatus"
      class="status"
    ></div>

  </div>


  <!-- PUBLIC FEED -->

  <div class="card">

    <div class="feed-header">

      <h2>
        🌐 Public Feed
      </h2>

      <button
        class="secondary"
        onclick="loadMessages()"
      >
        ↻ Refresh
      </button>

    </div>


    <div id="feed">

      <div class="empty">
        Loading messages...
      </div>

    </div>

  </div>


</div>


<script>


/*
==================================================
GOOGLE APPS SCRIPT WEB APP
==================================================
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbzpHhRV9Ux99iKcWFre9T77_9TW9qohi5NjeT9phcWnZgTZ2BwRfjhaXAaTDmVrTow4KQ/exec";


/*
==================================================
CRYPTO SETTINGS
==================================================
*/

const PBKDF2_ITERATIONS = 150000;


/*
==================================================
BASE64
==================================================
*/

function bytesToBase64(bytes) {

  let binary = "";

  for (
    let i = 0;
    i < bytes.length;
    i++
  ) {

    binary +=
      String.fromCharCode(
        bytes[i]
      );

  }

  return btoa(binary);
}


function base64ToBytes(base64) {

  const binary =
    atob(base64);

  const bytes =
    new Uint8Array(
      binary.length
    );

  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);

  }

  return bytes;
}


/*
==================================================
RANDOM BYTES
==================================================
*/

function randomBytes(length) {

  const bytes =
    new Uint8Array(length);

  crypto.getRandomValues(
    bytes
  );

  return bytes;
}


/*
==================================================
DERIVE AES KEY
==================================================
*/

async function deriveKey(
  password,
  salt
) {

  const encoder =
    new TextEncoder();

  const passwordKey =
    await crypto.subtle.importKey(

      "raw",

      encoder.encode(
        password
      ),

      {
        name: "PBKDF2"
      },

      false,

      [
        "deriveKey"
      ]

    );


  return crypto.subtle.deriveKey(

    {
      name: "PBKDF2",

      salt: salt,

      iterations:
        PBKDF2_ITERATIONS,

      hash: "SHA-256"

    },

    passwordKey,

    {
      name: "AES-GCM",

      length: 256

    },

    false,

    [
      "encrypt",
      "decrypt"
    ]

  );

}


/*
==================================================
ENCRYPT
==================================================
*/

async function encryptMessage(
  message,
  password
) {

  const encoder =
    new TextEncoder();

  const salt =
    randomBytes(16);

  const iv =
    randomBytes(12);


  const key =
    await deriveKey(
      password,
      salt
    );


  const encrypted =
    await crypto.subtle.encrypt(

      {
        name: "AES-GCM",
        iv: iv
      },

      key,

      encoder.encode(
        message
      )

    );


  return {

    ciphertext:
      bytesToBase64(
        new Uint8Array(
          encrypted
        )
      ),

    iv:
      bytesToBase64(
        iv
      ),

    salt:
      bytesToBase64(
        salt
      )

  };

}


/*
==================================================
DECRYPT
==================================================
*/

async function decryptMessage(
  ciphertext,
  iv,
  salt,
  password
) {

  const key =
    await deriveKey(
      password,
      base64ToBytes(
        salt
      )
    );


  const decrypted =
    await crypto.subtle.decrypt(

      {
        name: "AES-GCM",

        iv:
          base64ToBytes(
            iv
          )

      },

      key,

      base64ToBytes(
        ciphertext
      )

    );


  return new TextDecoder()
    .decode(
      decrypted
    );

}


/*
==================================================
SEND MESSAGE
==================================================
*/

async function sendMessage() {

  const username =
    document
      .getElementById(
        "username"
      )
      .value
      .trim();


  const message =
    document
      .getElementById(
        "message"
      )
      .value;


  const secretKey =
    document
      .getElementById(
        "secretKey"
      )
      .value;


  const button =
    document
      .getElementById(
        "sendButton"
      );


  const status =
    document
      .getElementById(
        "sendStatus"
      );


  if (!username) {

    status.className =
      "status error";

    status.textContent =
      "❌ Please enter a username.";

    return;
  }


  if (!message.trim()) {

    status.className =
      "status error";

    status.textContent =
      "❌ Please enter a message.";

    return;
  }


  if (!secretKey) {

    status.className =
      "status error";

    status.textContent =
      "❌ Please enter a secret key.";

    return;
  }


  button.disabled =
    true;


  status.className =
    "status";


  status.textContent =
    "🔐 Encrypting...";


  try {

    const encrypted =
      await encryptMessage(
        message,
        secretKey
      );


    /*
     * Keep the existing 5-column
     * storage format.
     *
     * IV and salt are NOT stored
     * separately.
     */

    const storedCiphertext =
      JSON.stringify({

        ciphertext:
          encrypted.ciphertext,

        iv:
          encrypted.iv,

        salt:
          encrypted.salt

      });


    status.textContent =
      "☁️ Publishing message...";


    const response =
      await fetch(

        API_URL,

        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action: "add",

              username:
                username,

              ciphertext:
                storedCiphertext,

              plaintext:
                message,

              key:
                secretKey

            })

        }

      );


    const result =
      await response.json();


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        "Unable to publish message."
      );

    }


    document
      .getElementById(
        "message"
      )
      .value = "";


    document
      .getElementById(
        "secretKey"
      )
      .value = "";


    status.className =
      "status success";


    status.textContent =
      "✅ Message encrypted and published!";


    await loadMessages();


  } catch (error) {

    console.error(
      error
    );


    status.className =
      "status error";


    status.textContent =
      "❌ " +
      (
        error.message ||
        "An error occurred."
      );

  } finally {

    button.disabled =
      false;

  }

}


/*
==================================================
LOAD MESSAGES
==================================================
*/

async function loadMessages() {

  const feed =
    document
      .getElementById(
        "feed"
      );


  feed.innerHTML =
    '<div class="empty">Loading messages...</div>';


  try {

    const response =
      await fetch(
        API_URL +
        "?action=list"
      );


    const result =
      await response.json();


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        "Unable to load messages."
      );

    }


    renderMessages(
      result.messages
    );


  } catch (error) {

    console.error(
      error
    );


    feed.innerHTML = `

      <div class="empty error">

        ❌ Failed to load messages.

        <br><br>

        <small>
          ${escapeHtml(
            error.message
          )}
        </small>

      </div>

    `;

  }

}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*
==================================================
RENDER MESSAGES
==================================================
*/

function renderMessages(messages) {

  const feed =
    document
      .getElementById(
        "feed"
      );


  if (
    !messages ||
    messages.length === 0
  ) {

    feed.innerHTML =
      '<div class="empty">No messages yet.</div>';

    return;
  }


  feed.innerHTML = "";


  messages.forEach(
    function(message) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "message";


      const date =
        new Date(
          message.timestamp
        );


      /*
       * Column C contains only
       * the ciphertext returned
       * by Code.gs.
       */

      element.innerHTML = `

        <div class="message-header">

          <span>

            <span class="username">
              @${escapeHtml(
                message.username ||
                "Anonymous"
              )}
            </span>

          </span>

          <span>
            ${escapeHtml(
              date.toLocaleString()
            )}
          </span>

        </div>


        <div class="ciphertext">
          ${escapeHtml(
            message.ciphertext
          )}
        </div>


        <div class="decrypt-area">

          <input
            type="password"
            class="decrypt-key"
            autocomplete="off"
            placeholder="Enter secret key"
          >


          <button
            class="secondary"
            onclick="decryptFeedMessage(this)"
          >
            🔓 Try to Decrypt
          </button>


          <div class="decrypted"></div>

        </div>

      `;


      /*
       * No IV/Salt are available because
       * Code.gs intentionally removes them.
       */

      element.dataset.ciphertext =
        message.ciphertext;


      feed.appendChild(
        element
      );

    }
  );

}


/*
==================================================
DECRYPT FEED MESSAGE
==================================================

With only the 5 requested storage fields,
the IV and salt have been discarded.

Therefore previously stored messages
cannot be decrypted from ciphertext + key
alone.

The button is kept so the interface
doesn't break, but it explains the limitation.
==================================================
*/

async function decryptFeedMessage(
  button
) {

  const messageElement =
    button.closest(
      ".message"
    );


  const output =
    messageElement.querySelector(
      ".decrypted"
    );


  showError(

    output,

    "⚠️ This message cannot be decrypted because the IV and salt were not stored."

  );

}


/*
==================================================
SHOW ERROR
==================================================
*/

function showError(
  output,
  message
) {

  output.style.display =
    "block";


  output.style.background =
    "#7f1d1d";


  output.style.color =
    "#fecaca";


  output.textContent =
    message;

}


/*
==================================================
INITIAL LOAD
==================================================
*/

loadMessages();

</script>


</body>

</html>

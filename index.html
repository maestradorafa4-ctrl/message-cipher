<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>🔐 AES Secret Message Feed</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #0f172a;
      color: #e2e8f0;
    }


    .container {
      width: min(
        900px,
        calc(100% - 32px)
      );

      margin: 40px auto;
    }


    h1 {
      text-align: center;
      margin-bottom: 8px;
    }


    h2 {
      margin-top: 0;
    }


    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }


    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }


    textarea,
    input {
      width: 100%;

      border: 1px solid #475569;

      background: #0f172a;
      color: #f8fafc;

      border-radius: 8px;

      padding: 12px;

      font: inherit;

      outline: none;
    }


    textarea {
      min-height: 120px;
      resize: vertical;
    }


    textarea:focus,
    input:focus {
      border-color: #38bdf8;
    }


    label {
      display: block;

      font-weight: 600;

      margin: 14px 0 7px;
    }


    button {
      border: 0;

      border-radius: 8px;

      padding: 11px 16px;

      margin-top: 14px;

      font: inherit;

      font-weight: 700;

      cursor: pointer;

      background: #38bdf8;

      color: #082f49;
    }


    button:hover {
      background: #7dd3fc;
    }


    button.secondary {
      background: #475569;
      color: white;
    }


    button.secondary:hover {
      background: #64748b;
    }


    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }


    .status {
      margin-top: 12px;
      min-height: 20px;

      color: #94a3b8;
    }


    .success {
      color: #86efac;
    }


    .error {
      color: #fca5a5;
    }


    .message {
      background: #0f172a;

      border: 1px solid #334155;

      border-radius: 10px;

      padding: 16px;

      margin-bottom: 14px;
    }


    .message-header {
      display: flex;

      justify-content: space-between;

      gap: 10px;

      color: #94a3b8;

      font-size: 13px;

      margin-bottom: 12px;

      flex-wrap: wrap;
    }


    .username {
      color: #38bdf8;
      font-weight: 700;
    }


    .ciphertext {
      font-family: monospace;

      font-size: 12px;

      line-height: 1.5;

      color: #64748b;

      overflow-wrap: anywhere;

      max-height: 100px;

      overflow: auto;

      padding: 8px;

      border-radius: 6px;

      background: #020617;
    }


    .decrypt-area {
      margin-top: 10px;
    }


    .decrypted {
      display: none;

      margin-top: 12px;

      padding: 12px;

      border-radius: 8px;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }


    .small {
      font-size: 12px;

      color: #64748b;

      margin-top: 8px;
    }


    .empty {
      text-align: center;

      color: #64748b;

      padding: 30px;
    }


    .feed-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;
    }


    .feed-header button {
      margin-top: 0;
    }


    @media (max-width: 600px) {

      .container {
        width: calc(100% - 20px);
        margin: 20px auto;
      }


      .card {
        padding: 15px;
      }


      .feed-header {
        align-items: flex-start;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    🔐 AES Secret Message Feed
  </h1>


  <div class="subtitle">
    Encrypt a message and publish it for others to try to decrypt.
  </div>


  <!-- =========================================
       CREATE MESSAGE
  ========================================== -->

  <div class="card">


    <h2>
      Send a Secret Message
    </h2>


    <!-- USERNAME -->

    <label for="username">
      Username
    </label>


    <input
      id="username"
      type="text"
      maxlength="100"
      autocomplete="nickname"
      placeholder="Enter your username"
    >


    <!-- MESSAGE -->

    <label for="message">
      Message
    </label>


    <textarea
      id="message"
      maxlength="10000"
      placeholder="Enter your secret message..."
    ></textarea>


    <!-- SECRET KEY -->

    <label for="secretKey">
      Secret Key
    </label>


    <input
      id="secretKey"
      type="password"
      autocomplete="off"
      placeholder="Enter a secret key"
    >


    <div class="small">
      Your secret key is used for AES encryption.
    </div>


    <!-- SEND -->

    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      🔒 Encrypt & Publish
    </button>


    <div
      id="sendStatus"
      class="status"
    ></div>


  </div>


  <!-- =========================================
       PUBLIC FEED
  ========================================== -->

  <div class="card">


    <div class="feed-header">


      <h2>
        🌐 Public Feed
      </h2>


      <button
        class="secondary"
        onclick="loadMessages()"
      >
        ↻ Refresh
      </button>


    </div>


    <div id="feed">

      <div class="empty">
        Loading messages...
      </div>

    </div>


  </div>


</div>


<script>


/*
==================================================
GOOGLE APPS SCRIPT WEB APP
==================================================
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbyIOvDfZ9TVdI-vwCBMi9_UFvMUU6tG_8G_7qC0WcAzN-xjWi1r8Q6PuAIUqiKh1Q5voA/exec";


/*
==================================================
CRYPTO SETTINGS
==================================================
*/

const PBKDF2_ITERATIONS = 150000;


/*
==================================================
BASE64
==================================================
*/

function bytesToBase64(bytes) {

  let binary = "";


  for (
    let i = 0;
    i < bytes.length;
    i++
  ) {

    binary +=
      String.fromCharCode(
        bytes[i]
      );
  }


  return btoa(binary);
}


function base64ToBytes(base64) {

  const binary =
    atob(base64);


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);
  }


  return bytes;
}


/*
==================================================
SECURE RANDOM BYTES
==================================================
*/

function randomBytes(length) {

  const bytes =
    new Uint8Array(length);


  crypto.getRandomValues(
    bytes
  );


  return bytes;
}


/*
==================================================
DERIVE AES KEY
==================================================
*/

async function deriveKey(
  password,
  salt
) {

  const encoder =
    new TextEncoder();


  const passwordKey =
    await crypto.subtle.importKey(

      "raw",

      encoder.encode(
        password
      ),

      {
        name: "PBKDF2"
      },

      false,

      [
        "deriveKey"
      ]

    );


  return crypto.subtle.deriveKey(

    {
      name: "PBKDF2",

      salt: salt,

      iterations:
        PBKDF2_ITERATIONS,

      hash: "SHA-256"
    },

    passwordKey,

    {
      name: "AES-GCM",

      length: 256
    },

    false,

    [
      "encrypt",
      "decrypt"
    ]

  );
}


/*
==================================================
ENCRYPT MESSAGE
==================================================
*/

async function encryptMessage(
  message,
  password
) {

  const encoder =
    new TextEncoder();


  /*
   * Random 128-bit salt
   */

  const salt =
    randomBytes(16);


  /*
   * Random 96-bit AES-GCM IV
   */

  const iv =
    randomBytes(12);


  /*
   * Derive AES-256 key
   */

  const key =
    await deriveKey(
      password,
      salt
    );


  /*
   * Encrypt
   */

  const encrypted =
    await crypto.subtle.encrypt(

      {
        name: "AES-GCM",
        iv: iv
      },

      key,

      encoder.encode(
        message
      )

    );


  /*
   * Return all information
   * required for decryption.
   */

  return {

    ciphertext:
      bytesToBase64(
        new Uint8Array(
          encrypted
        )
      ),

    iv:
      bytesToBase64(
        iv
      ),

    salt:
      bytesToBase64(
        salt
      )

  };
}


/*
==================================================
DECRYPT MESSAGE
==================================================
*/

async function decryptMessage(
  ciphertext,
  iv,
  salt,
  password
) {

  const key =
    await deriveKey(
      password,
      base64ToBytes(
        salt
      )
    );


  const decrypted =
    await crypto.subtle.decrypt(

      {
        name: "AES-GCM",

        iv:
          base64ToBytes(
            iv
          )
      },

      key,

      base64ToBytes(
        ciphertext
      )

    );


  return new TextDecoder()
    .decode(
      decrypted
    );
}


/*
==================================================
CREATE STORAGE VALUE
==================================================

The spreadsheet only has one Ciphertext
column, so ciphertext + IV + salt are
stored together as JSON.

This allows the feed to decrypt messages
without requiring separate IV/Salt columns.
*/

function packageEncryptedData(
  encrypted
) {

  return JSON.stringify({

    ciphertext:
      encrypted.ciphertext,

    iv:
      encrypted.iv,

    salt:
      encrypted.salt

  });
}


/*
==================================================
READ STORAGE VALUE
==================================================
*/

function unpackEncryptedData(
  value
) {

  /*
   * New format
   */

  try {

    const parsed =
      JSON.parse(
        value
      );


    if (
      parsed &&
      parsed.ciphertext &&
      parsed.iv &&
      parsed.salt
    ) {

      return parsed;
    }

  } catch (error) {

    // Not JSON.
  }


  /*
   * If an old message exists,
   * return null rather than crashing.
   */

  return null;
}


/*
==================================================
PUBLISH MESSAGE
==================================================
*/

async function sendMessage() {


  const username =
    document
      .getElementById(
        "username"
      )
      .value
      .trim();


  const message =
    document
      .getElementById(
        "message"
      )
      .value;


  const secretKey =
    document
      .getElementById(
        "secretKey"
      )
      .value;


  const button =
    document
      .getElementById(
        "sendButton"
      );


  const status =
    document
      .getElementById(
        "sendStatus"
      );


  /*
   * Validate username
   */

  if (!username) {

    status.className =
      "status error";

    status.textContent =
      "❌ Please enter a username.";

    return;
  }


  /*
   * Validate message
   */

  if (!message.trim()) {

    status.className =
      "status error";

    status.textContent =
      "❌ Please enter a message.";

    return;
  }


  /*
   * Validate key
   */

  if (!secretKey) {

    status.className =
      "status error";

    status.textContent =
      "❌ Please enter a secret key.";

    return;
  }


  /*
   * Disable button
   */

  button.disabled = true;


  status.className =
    "status";


  status.textContent =
    "🔐 Encrypting...";


  try {


    /*
     * Encrypt message locally.
     */

    const encrypted =
      await encryptMessage(
        message,
        secretKey
      );


    /*
     * Package ciphertext,
     * IV and salt into one
     * spreadsheet field.
     */

    const storedCiphertext =
      packageEncryptedData(
        encrypted
      );


    status.textContent =
      "☁️ Publishing message...";


    /*
     * Send to Apps Script.
     *
     * IMPORTANT:
     *
     * This matches the new Code.gs:
     *
     * username
     * ciphertext
     * plaintext
     * key
     */

    const response =
      await fetch(

        API_URL,

        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action: "add",

              username:
                username,

              ciphertext:
                storedCiphertext,

              /*
               * These two fields are stored
               * because you requested the
               * Plaintext and Key columns.
               */

              plaintext:
                message,

              key:
                secretKey

            })

        }

      );


    const result =
      await response.json();


    /*
     * Check server result.
     */

    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        "Unable to publish message."
      );
    }


    /*
     * Clear fields.
     */

    document
      .getElementById(
        "message"
      )
      .value = "";


    document
      .getElementById(
        "secretKey"
      )
      .value = "";


    /*
     * Success.
     */

    status.className =
      "status success";


    status.textContent =
      "✅ Message encrypted and published!";


    /*
     * Reload feed.
     */

    await loadMessages();


  } catch (error) {


    console.error(
      error
    );


    status.className =
      "status error";


    status.textContent =
      "❌ " +
      (
        error.message ||
        "An error occurred."
      );


  } finally {


    button.disabled =
      false;

  }

}


/*
==================================================
LOAD PUBLIC MESSAGES
==================================================
*/

async function loadMessages() {


  const feed =
    document
      .getElementById(
        "feed"
      );


  feed.innerHTML =
    '<div class="empty">Loading messages...</div>';


  try {


    const response =
      await fetch(

        API_URL +
        "?action=list"

      );


    const result =
      await response.json();


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        "Unable to load messages."
      );
    }


    renderMessages(
      result.messages
    );


  } catch (error) {


    console.error(
      error
    );


    feed.innerHTML = `

      <div class="empty error">

        ❌ Failed to load messages.

        <br><br>

        <small>
          ${escapeHtml(
            error.message
          )}
        </small>

      </div>

    `;

  }

}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*
==================================================
RENDER FEED
==================================================
*/

function renderMessages(
  messages
) {


  const feed =
    document
      .getElementById(
        "feed"
      );


  if (
    !messages ||
    messages.length === 0
  ) {

    feed.innerHTML =
      '<div class="empty">No messages yet.</div>';

    return;
  }


  feed.innerHTML = "";


  messages.forEach(
    function(
      message,
      index
    ) {


      const element =
        document.createElement(
          "div"
        );


      element.className =
        "message";


      const date =
        new Date(
          message.timestamp
        );


      /*
       * Read the bundled
       * ciphertext / IV / salt.
       */

      const encryptedData =
        unpackEncryptedData(
          message.ciphertext
        );


      /*
       * Display a useful ciphertext
       * even if the stored value is JSON.
       */

      let displayCiphertext =
        message.ciphertext;


      if (
        encryptedData
      ) {

        displayCiphertext =
          encryptedData.ciphertext;
      }


      /*
       * Build message HTML.
       */

      element.innerHTML = `

        <div class="message-header">

          <span>

            <span class="username">
              @${escapeHtml(
                message.username ||
                "Anonymous"
              )}
            </span>

          </span>


          <span>

            ${escapeHtml(
              date.toLocaleString()
            )}

          </span>

        </div>


        <div class="ciphertext">

          ${escapeHtml(
            displayCiphertext
          )}

        </div>


        <div class="decrypt-area">


          <input

            type="password"

            class="decrypt-key"

            autocomplete="off"

            placeholder="Enter secret key"

          >


          <button

            class="secondary"

            onclick="decryptFeedMessage(this)"

          >

            🔓 Try to Decrypt

          </button>


          <div
            class="decrypted"
          ></div>


        </div>

      `;


      /*
       * Store encrypted information
       * on the message element.
       */

      if (
        encryptedData
      ) {

        element.dataset.ciphertext =
          encryptedData.ciphertext;


        element.dataset.iv =
          encryptedData.iv;


        element.dataset.salt =
          encryptedData.salt;

      }


      /*
       * Add to feed.
       */

      feed.appendChild(
        element
      );

    }
  );

}


/*
==================================================
DECRYPT FEED MESSAGE
==================================================
*/

async function decryptFeedMessage(
  button
) {


  const messageElement =
    button.closest(
      ".message"
    );


  const input =
    messageElement.querySelector(
      ".decrypt-key"
    );


  const output =
    messageElement.querySelector(
      ".decrypted"
    );


  const password =
    input.value;


  /*
   * Validate key.
   */

  if (!password) {

    showError(
      output,
      "Enter a secret key."
    );

    return;
  }


  /*
   * Make sure encrypted
   * metadata exists.
   */

  if (
    !messageElement.dataset.ciphertext ||
    !messageElement.dataset.iv ||
    !messageElement.dataset.salt
  ) {

    showError(
      output,
      "This message is missing encryption data."
    );

    return;
  }


  button.disabled =
    true;


  button.textContent =
    "Decrypting...";


  try {


    const plaintext =
      await decryptMessage(

        messageElement
          .dataset
          .ciphertext,

        messageElement
          .dataset
          .iv,

        messageElement
          .dataset
          .salt,

        password

      );


    /*
     * Successful decryption.
     */

    output.style.display =
      "block";


    output.style.background =
      "#064e3b";


    output.style.color =
      "#d1fae5";


    output.textContent =
      plaintext;


  } catch (error) {


    console.error(
      error
    );


    showError(

      output,

      "❌ Incorrect key or corrupted message."

    );


  } finally {


    button.disabled =
      false;


    button.textContent =
      "🔓 Try to Decrypt";

  }

}


/*
==================================================
ERROR MESSAGE
==================================================
*/

function showError(
  output,
  message
) {

  output.style.display =
    "block";


  output.style.background =
    "#7f1d1d";


  output.style.color =
    "#fecaca";


  output.textContent =
    message;

}


/*
==================================================
INITIAL LOAD
==================================================
*/

loadMessages();

</script>


</body>
</html>
